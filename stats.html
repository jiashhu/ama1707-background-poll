<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7a1736" />
    <meta name="robots" content="noindex,nofollow" />
    <title>AMA1707 Live Poll Results</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <main class="stats-shell">
      <header class="stats-header">
        <div>
          <div class="course-badge" data-course-code>AMA1707</div>
          <p class="eyebrow" data-course-title>Introduction to Calculus</p>
          <h1>Live class profile</h1>
          <p class="intro">
            Anonymous aggregate results. The page refreshes automatically.
          </p>
        </div>
        <div class="response-total" aria-live="polite">
          <strong id="total-responses">0</strong>
          <span>responses</span>
        </div>
      </header>

      <section id="stats-status" class="stats-status" aria-live="polite">
        Loading results…
      </section>

      <div id="charts" class="charts" hidden>
        <section class="chart-card" aria-labelledby="origin-chart-title">
          <div class="chart-heading">
            <div>
              <p class="chart-kicker">Question 1</p>
              <h2 id="origin-chart-title">Secondary education location</h2>
            </div>
          </div>
          <div id="origin-chart" class="bar-chart"></div>
        </section>

        <section class="chart-card" aria-labelledby="math-chart-title">
          <div class="chart-heading">
            <div>
              <p class="chart-kicker">Question 2 · multiple selections allowed</p>
              <h2 id="math-chart-title">Previous mathematics experience</h2>
            </div>
          </div>
          <div id="math-chart" class="bar-chart"></div>
        </section>
      </div>

      <footer class="stats-footer">
        <span id="last-updated">Waiting for data</span>
        <button id="refresh-button" class="secondary-button" type="button">Refresh now</button>
      </footer>
    </main>

    <script src="config.js"></script>
    <script src="stats.js"></script>
  </body>
</html>
